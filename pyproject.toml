[project]
name = "market-risk-analysis"
version = "1.0.0"
description = "市场舆情风险挖掘系统"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    # 深度学习
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "transformers>=4.35.2",
    "sentencepiece>=0.1.99",
    "jieba>=0.42.1",
    
    # 后端
    "flask>=2.3.3",
    "flask-cors>=4.0.0",
    
    # 前端
    "streamlit>=1.28.1",
    "pandas>=2.1.3",
    "plotly>=5.18.0",
    "numpy>=1.24.3",
    
    # 网络和工具
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
]

